<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader View</title>
<style>
  :root {
    --bg: #1e1e2e;
    --text: #cdd6f4;
    --dim: #6c7086;
    --accent: #f9e2af;
    --highlight-bg: #45475a;
    --surface: #313244;
    --border: #585b70;
    --gold: #f9e2af;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Times New Roman', serif;
    line-height: 1.8;
    font-size: 18px;
  }

  /* Top bar */
  #toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  #toolbar button {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 14px;
    cursor: pointer;
    font-family: system-ui, sans-serif;
  }

  #toolbar button:hover { border-color: var(--gold); }
  #toolbar button.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }

  #toolbar label {
    font-family: system-ui, sans-serif;
    font-size: 13px;
    color: var(--dim);
  }

  #toolbar select, #toolbar input[type="range"] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 13px;
  }

  #speed-display {
    font-family: monospace;
    font-size: 13px;
    color: var(--accent);
    min-width: 36px;
  }

  #progress-bar {
    height: 3px;
    background: var(--border);
    position: fixed;
    top: 52px;
    left: 0;
    right: 0;
    z-index: 99;
  }

  #progress-fill {
    height: 100%;
    background: var(--gold);
    width: 0%;
    transition: width 0.3s;
  }

  /* File drop zone */
  #drop-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    margin-top: 60px;
    padding: 40px;
    text-align: center;
  }

  #drop-zone h1 {
    font-size: 28px;
    color: var(--gold);
    margin-bottom: 16px;
    font-weight: normal;
  }

  #drop-zone p {
    color: var(--dim);
    font-family: system-ui, sans-serif;
    font-size: 15px;
    margin-bottom: 12px;
  }

  #drop-zone .drop-area {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 60px 80px;
    margin: 20px 0;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  #drop-zone .drop-area:hover,
  #drop-zone .drop-area.dragover {
    border-color: var(--gold);
  }

  #drop-zone .drop-area p {
    font-size: 17px;
    color: var(--text);
  }

  #file-input { display: none; }

  .shortcuts {
    margin-top: 30px;
    text-align: left;
    font-family: monospace;
    font-size: 13px;
    color: var(--dim);
    line-height: 2;
  }

  .shortcuts kbd {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 6px;
    font-size: 12px;
    color: var(--text);
  }

  /* Reader content */
  #reader {
    display: none;
    max-width: 720px;
    margin: 0 auto;
    padding: 80px 24px 120px;
  }

  #reader h1, #reader h2, #reader h3 {
    color: var(--gold);
    margin: 1.5em 0 0.5em;
    font-weight: normal;
    line-height: 1.3;
  }

  #reader h1 { font-size: 1.6em; }
  #reader h2 { font-size: 1.3em; }
  #reader h3 { font-size: 1.1em; }

  .para {
    padding: 6px 12px;
    margin: 4px -12px;
    border-radius: 4px;
    border-left: 3px solid transparent;
    transition: background 0.2s, border-color 0.2s;
    cursor: pointer;
  }

  .para:hover {
    background: rgba(69, 71, 90, 0.3);
  }

  .para.speaking {
    background: var(--highlight-bg);
    border-left-color: var(--gold);
  }

  .para.spoken {
    opacity: 0.6;
  }

  /* Font size controls */
  #reader.font-small { font-size: 15px; }
  #reader.font-medium { font-size: 18px; }
  #reader.font-large { font-size: 22px; }
  #reader.font-xl { font-size: 26px; }

  /* Status bar */
  #status {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 6px 20px;
    font-family: monospace;
    font-size: 12px;
    color: var(--dim);
    display: flex;
    justify-content: space-between;
    z-index: 100;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button id="btn-load" title="Load file">Load</button>
  <button id="btn-play" title="Space: Play/Pause">Play</button>
  <button id="btn-stop" title="Stop">Stop</button>
  <button id="btn-back" title="Previous paragraph">&larr;</button>
  <button id="btn-forward" title="Next paragraph">&rarr;</button>
  <label>Speed</label>
  <input type="range" id="speed" min="0.5" max="3.0" step="0.1" value="1.0">
  <span id="speed-display">1.0x</span>
  <label>Voice</label>
  <select id="voice-select"></select>
  <label>Size</label>
  <select id="font-size">
    <option value="font-small">S</option>
    <option value="font-medium" selected>M</option>
    <option value="font-large">L</option>
    <option value="font-xl">XL</option>
  </select>
</div>

<div id="progress-bar"><div id="progress-fill"></div></div>

<div id="drop-zone">
  <h1>Reader View</h1>
  <p>Read and listen to documents simultaneously</p>
  <div class="drop-area" id="drop-area">
    <p>Drop a .txt or .md file here</p>
    <p style="font-size: 13px; color: var(--dim);">or click to browse</p>
  </div>
  <input type="file" id="file-input" accept=".txt,.md,.text">
  <div class="shortcuts">
    <kbd>Space</kbd> Play / Pause<br>
    <kbd>S</kbd> Stop<br>
    <kbd>&larr;</kbd> Previous paragraph<br>
    <kbd>&rarr;</kbd> Next paragraph<br>
    <kbd>+</kbd> / <kbd>-</kbd> Speed up / down<br>
    <kbd>[</kbd> / <kbd>]</kbd> Font smaller / larger<br>
    <kbd>Home</kbd> Jump to top<br>
    <kbd>G</kbd> Jump to paragraph (enter number)
  </div>
</div>

<div id="reader"></div>

<div id="status">
  <span id="status-left">No document loaded</span>
  <span id="status-right"></span>
</div>

<script>
const synth = window.speechSynthesis;
let paragraphs = [];
let paraEls = [];
let currentIdx = -1;
let isPlaying = false;
let isPaused = false;
let voices = [];
let selectedVoice = null;
let fileName = '';
let currentSentIdx = 0;
let lastSpeechActivity = Date.now();

// Elements
const reader = document.getElementById('reader');
const dropZone = document.getElementById('drop-zone');
const dropArea = document.getElementById('drop-area');
const fileInput = document.getElementById('file-input');
const btnPlay = document.getElementById('btn-play');
const btnStop = document.getElementById('btn-stop');
const btnBack = document.getElementById('btn-back');
const btnForward = document.getElementById('btn-forward');
const btnLoad = document.getElementById('btn-load');
const speedSlider = document.getElementById('speed');
const speedDisplay = document.getElementById('speed-display');
const voiceSelect = document.getElementById('voice-select');
const fontSelect = document.getElementById('font-size');
const progressFill = document.getElementById('progress-fill');
const statusLeft = document.getElementById('status-left');
const statusRight = document.getElementById('status-right');

// ---------------------------------------------------------------------------
// Speech engine. Two of them.
//   'kokoro'  — local Kokoro-FastAPI on 127.0.0.1:8880 (this desktop). Real
//               voices, nothing leaves the machine, no utterance cutoff.
//   'browser' — window.speechSynthesis. The fallback, and what the phone uses.
// Chrome exempts 127.0.0.1 from mixed-content blocking, so an https page may
// call it; Kokoro returns permissive CORS. Detection is a 1.5s probe on load.
// ---------------------------------------------------------------------------
const KOKORO_URL = 'http://127.0.0.1:8880';
let engine = 'browser';
let kokoroVoices = [];
const audioEl = new Audio();
let prefetch = { idx: null, url: null };

async function detectKokoro() {
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 1500);
    const r = await fetch(KOKORO_URL + '/v1/audio/voices', { signal: ctl.signal });
    clearTimeout(t);
    if (!r.ok) return;
    const d = await r.json();
    const raw = d.voices || d;
    kokoroVoices = (Array.isArray(raw) ? raw : []).map(v => (typeof v === 'string' ? v : (v.id || v.name))).filter(Boolean);
    if (!kokoroVoices.length) return;
    engine = 'kokoro';
    loadKokoroVoices();
    updateStatus();
  } catch (e) {
    /* not running, or not this machine — stay on the browser engine */
  }
}

function loadKokoroVoices() {
  voiceSelect.innerHTML = '';
  // af_heart first: it is what Obsidian Aloud already uses here.
  const ordered = [...kokoroVoices].sort((a, b) =>
    (a === 'af_heart' ? -1 : b === 'af_heart' ? 1 : a.localeCompare(b)));
  ordered.forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    voiceSelect.appendChild(o);
  });
  voiceSelect.value = kokoroVoices.includes('af_heart') ? 'af_heart' : ordered[0];
}

function plainTextOf(idx) {
  return paragraphs[idx]
    .replace(/^#{1,3}\s*/, '').replace(/\*\*/g, '').replace(/\*/g, '')
    .replace(/`/g, '').replace(/[-*]\s/g, '');
}

async function kokoroSynth(text) {
  const r = await fetch(KOKORO_URL + '/v1/audio/speech', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'kokoro',
      voice: voiceSelect.value || 'af_heart',
      input: text,
      response_format: 'mp3'
    })
  });
  if (!r.ok) throw new Error('kokoro ' + r.status);
  return URL.createObjectURL(await r.blob());
}

// Synthesize the NEXT paragraph while this one plays, so the gap between
// paragraphs is silence-free rather than a synthesis pause.
function prefetchNext(idx) {
  const n = idx + 1;
  if (n >= paragraphs.length) return;
  const t = plainTextOf(n);
  if (!t.trim()) return;
  if (prefetch.idx === n) return;
  kokoroSynth(t).then(url => { prefetch = { idx: n, url }; }).catch(() => {});
}

function fallbackToBrowser(why) {
  console.warn('Kokoro unavailable (' + why + ') — falling back to browser voices');
  engine = 'browser';
  prefetch = { idx: null, url: null };
  loadVoices();
  updateStatus();
}

async function speakKokoro(idx) {
  currentIdx = idx;
  const text = plainTextOf(idx);
  if (!text.trim()) { currentIdx = idx + 1; if (isPlaying) speak(currentIdx); return; }

  paraEls.forEach((el, i) => {
    el.classList.remove('speaking');
    if (i < idx) el.classList.add('spoken'); else el.classList.remove('spoken');
  });
  paraEls[idx].classList.add('speaking');
  paraEls[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateStatus(); updateProgress();

  let url;
  try {
    if (prefetch.idx === idx && prefetch.url) { url = prefetch.url; prefetch = { idx: null, url: null }; }
    else { statusRight.textContent = 'Synthesizing…'; url = await kokoroSynth(text); }
  } catch (e) { fallbackToBrowser(e.message); if (isPlaying) speak(idx); return; }

  audioEl.src = url;
  audioEl.playbackRate = parseFloat(speedSlider.value);
  audioEl.onended = () => {
    URL.revokeObjectURL(url);
    if (isPlaying && !isPaused) speak(currentIdx + 1);
  };
  audioEl.onerror = () => { URL.revokeObjectURL(url); fallbackToBrowser('playback error'); };
  audioEl.play().catch(e => fallbackToBrowser('autoplay blocked'));
  prefetchNext(idx);
  updateStatus();
}


// Load voices
function loadVoices() {
  voices = synth.getVoices();
  voiceSelect.innerHTML = '';

  // Prefer English voices, put them first
  const english = voices.filter(v => v.lang.startsWith('en'));
  const others = voices.filter(v => !v.lang.startsWith('en'));
  const sorted = [...english, ...others];

  sorted.forEach((voice, i) => {
    const opt = document.createElement('option');
    opt.value = voices.indexOf(voice);
    opt.textContent = `${voice.name} (${voice.lang})`;
    if (voice.default) opt.selected = true;
    voiceSelect.appendChild(opt);
  });

  // Default to first English voice
  if (english.length > 0 && !voices.find(v => v.default && v.lang.startsWith('en'))) {
    voiceSelect.value = voices.indexOf(english[0]);
  }
}

synth.onvoiceschanged = loadVoices;
loadVoices();
detectKokoro();

voiceSelect.addEventListener('change', () => {
  if (engine === 'kokoro') {
    prefetch = { idx: null, url: null };
    if (isPlaying && currentIdx >= 0) speak(currentIdx);
    return;
  }
  selectedVoice = voices[parseInt(voiceSelect.value)];
});

// File loading
btnLoad.addEventListener('click', () => fileInput.click());
dropArea.addEventListener('click', () => fileInput.click());

dropArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropArea.classList.add('dragover');
});

dropArea.addEventListener('dragleave', () => {
  dropArea.classList.remove('dragover');
});

dropArea.addEventListener('drop', (e) => {
  e.preventDefault();
  dropArea.classList.remove('dragover');
  if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) loadFile(fileInput.files[0]);
});

function loadFile(file) {
  fileName = file.name;
  const fr = new FileReader();
  fr.onload = () => parseAndDisplay(fr.result);
  fr.readAsText(file);
}

function parseAndDisplay(text) {
  // Stop any current speech
  stop();

  // Smart paragraph splitting:
  // 1. First split on blank lines (standard markdown)
  // 2. Then split long blocks on single newlines where each line is a real paragraph
  //    (over 80 chars — not a heading, not a list item, not a short line)
  const blocks = text.split(/\n\s*\n/);
  const expanded = [];
  for (const block of blocks) {
    const trimmed = block.trim();
    if (!trimmed) continue;
    // If block contains single-newline-separated long lines, split them
    const lines = trimmed.split('\n');
    if (lines.length > 1 && lines.some(l => l.trim().length > 80)) {
      let current = '';
      for (const line of lines) {
        const lt = line.trim();
        if (!lt) {
          if (current) { expanded.push(current); current = ''; }
          continue;
        }
        // A long line (>80 chars) that doesn't start with list/heading markers
        // is likely its own paragraph
        const isLongLine = lt.length > 80 && !/^[-*+]\s/.test(lt) && !/^#{1,6}\s/.test(lt);
        const currentIsLong = current.length > 80;
        if (current && isLongLine && currentIsLong) {
          // Both are substantial — treat as separate paragraphs
          expanded.push(current);
          current = lt;
        } else if (!current) {
          current = lt;
        } else {
          // Short line or continuation — merge
          current += '\n' + lt;
        }
      }
      if (current) expanded.push(current);
    } else {
      expanded.push(trimmed);
    }
  }
  paragraphs = expanded.filter(p => p.length > 0);

  // Build HTML
  reader.innerHTML = '';
  paraEls = [];

  paragraphs.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'para';
    div.dataset.idx = i;

    // Detect headings (markdown)
    if (/^#{1,3}\s/.test(p)) {
      const level = p.match(/^(#{1,3})/)[1].length;
      const text = p.replace(/^#{1,3}\s*/, '');
      const h = document.createElement(`h${level}`);
      h.textContent = text;
      div.appendChild(h);
    } else if (/^[-*]\s/.test(p)) {
      // Bullet list — preserve lines
      const lines = p.split('\n');
      const ul = document.createElement('ul');
      ul.style.paddingLeft = '20px';
      ul.style.margin = '8px 0';
      lines.forEach(line => {
        const li = document.createElement('li');
        li.textContent = line.replace(/^[-*]\s*/, '');
        li.style.marginBottom = '4px';
        ul.appendChild(li);
      });
      div.appendChild(ul);
    } else if (/^\*\*.*\*\*$/.test(p.split('\n')[0]) && p.split('\n').length === 1) {
      // Bold standalone line
      const strong = document.createElement('strong');
      strong.textContent = p.replace(/\*\*/g, '');
      strong.style.color = 'var(--gold)';
      div.appendChild(strong);
    } else {
      // Regular paragraph — handle inline markdown minimally
      div.innerHTML = `<p>${markdownInline(p)}</p>`;
    }

    div.addEventListener('click', () => {
      jumpTo(i);
    });

    reader.appendChild(div);
    paraEls.push(div);
  });

  // Switch view
  dropZone.style.display = 'none';
  reader.style.display = 'block';

  updateStatus();
}

function markdownInline(text) {
  // Basic inline: bold, italic, links stripped
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code style="background:var(--surface);padding:1px 4px;border-radius:3px;font-size:0.9em;">$1</code>')
    .replace(/\n/g, '<br>');
}

// Speech controls — split into sentences to avoid Chromium 15s cutoff bug
function textToSentences(text) {
  // Split on sentence boundaries but keep the delimiters
  const raw = text.match(/[^.!?]+[.!?]+[\s]*/g) || [text];
  // Merge very short fragments (e.g. "Dr." "Mr." abbreviations)
  const merged = [];
  for (const s of raw) {
    if (merged.length > 0 && merged[merged.length - 1].length < 30) {
      merged[merged.length - 1] += s;
    } else {
      merged.push(s);
    }
  }
  return merged.map(s => s.trim()).filter(s => s.length > 0);
}

function speak(idx, startSentIdx = 0) {
  if (idx < 0 || idx >= paragraphs.length) {
    stop();
    return;
  }

  if (engine === 'kokoro') { speakKokoro(idx); return; }

  synth.cancel();
  currentIdx = idx;
  lastSpeechActivity = Date.now();

  // Get plain text for speech
  const text = paragraphs[idx]
    .replace(/^#{1,3}\s*/, '')
    .replace(/\*\*/g, '')
    .replace(/\*/g, '')
    .replace(/`/g, '')
    .replace(/[-*]\s/g, '');

  if (text.trim().length === 0) {
    currentIdx = idx + 1;
    if (isPlaying) speak(currentIdx);
    return;
  }

  // Highlight
  paraEls.forEach((el, i) => {
    el.classList.remove('speaking');
    if (i < idx) el.classList.add('spoken');
    else el.classList.remove('spoken');
  });
  paraEls[idx].classList.add('speaking');
  paraEls[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });

  // Split into sentences and speak sequentially
  const sentences = textToSentences(text);
  let sentIdx = Math.min(startSentIdx, Math.max(sentences.length - 1, 0));

  function speakNext() {
    if (sentIdx >= sentences.length) {
      // Paragraph done — move to next
      if (isPlaying && !isPaused) {
        speak(idx + 1);
      }
      return;
    }

    currentSentIdx = sentIdx;

    const utt = new SpeechSynthesisUtterance(sentences[sentIdx]);
    utt.rate = parseFloat(speedSlider.value);

    const vi = parseInt(voiceSelect.value);
    if (!isNaN(vi) && voices[vi]) utt.voice = voices[vi];

    utt.onstart = () => {
      lastSpeechActivity = Date.now();
    };

    utt.onend = () => {
      lastSpeechActivity = Date.now();
      sentIdx++;
      if (isPlaying && !isPaused) {
        speakNext();
      }
    };

    utt.onerror = (e) => {
      if (e.error !== 'canceled') {
        console.error('Speech error:', e.error, 'sentence:', sentences[sentIdx]);
        // Try to recover by moving to next sentence
        lastSpeechActivity = Date.now();
        sentIdx++;
        if (isPlaying && !isPaused) {
          setTimeout(speakNext, 100);
        }
      }
    };

    synth.speak(utt);
  }

  speakNext();
  updateStatus();
  updateProgress();
}

function play() {
  if (paragraphs.length === 0) return;

  if (isPaused) {
    if (engine === 'kokoro') audioEl.play(); else synth.resume();
    isPaused = false;
    isPlaying = true;
    btnPlay.textContent = 'Pause';
    btnPlay.classList.add('active');
    return;
  }

  isPlaying = true;
  isPaused = false;
  btnPlay.textContent = 'Pause';
  btnPlay.classList.add('active');

  if (currentIdx < 0) currentIdx = 0;
  speak(currentIdx);
}

function pause() {
  if (engine === 'kokoro') audioEl.pause(); else synth.pause();
  isPaused = true;
  isPlaying = false;
  btnPlay.textContent = 'Play';
  btnPlay.classList.remove('active');
}

function stop() {
  if (engine === 'kokoro') { audioEl.pause(); audioEl.removeAttribute('src'); prefetch = { idx: null, url: null }; }
  else synth.cancel();
  isPlaying = false;
  isPaused = false;
  currentIdx = -1;
  btnPlay.textContent = 'Play';
  btnPlay.classList.remove('active');
  paraEls.forEach(el => {
    el.classList.remove('speaking', 'spoken');
  });
  progressFill.style.width = '0%';
  updateStatus();
}

function jumpTo(idx) {
  if (idx < 0) idx = 0;
  if (idx >= paragraphs.length) idx = paragraphs.length - 1;

  // Clear spoken state for paragraphs after target
  paraEls.forEach((el, i) => {
    el.classList.remove('speaking', 'spoken');
    if (i < idx) el.classList.add('spoken');
  });

  currentIdx = idx;

  if (isPlaying || isPaused) {
    isPaused = false;
    isPlaying = true;
    btnPlay.textContent = 'Pause';
    btnPlay.classList.add('active');
    speak(idx);
  } else {
    // Just highlight and scroll, don't auto-play
    paraEls[idx].classList.add('speaking');
    paraEls[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
    updateStatus();
    updateProgress();
  }
}

function togglePlayPause() {
  if (isPlaying) pause();
  else play();
}

// UI updates
function updateProgress() {
  if (paragraphs.length === 0) return;
  const pct = ((currentIdx + 1) / paragraphs.length) * 100;
  progressFill.style.width = pct + '%';
}

function updateStatus() {
  if (paragraphs.length === 0) {
    statusLeft.textContent = 'No document loaded';
    statusRight.textContent = '';
    return;
  }

  const pos = currentIdx >= 0 ? currentIdx + 1 : 0;
  statusLeft.textContent = `${fileName} | ${pos} / ${paragraphs.length} paragraphs`;
  const state = isPlaying ? 'Playing' : isPaused ? 'Paused' : 'Stopped';
  statusRight.textContent = state + (engine === 'kokoro' ? ' · Kokoro (local)' : ' · browser voice');
}

// Speed control
speedSlider.addEventListener('input', () => {
  speedDisplay.textContent = parseFloat(speedSlider.value).toFixed(1) + 'x';
  if (engine === 'kokoro') audioEl.playbackRate = parseFloat(speedSlider.value);
});

// Font size
fontSelect.addEventListener('change', () => {
  reader.className = fontSelect.value;
});

// Button handlers
btnPlay.addEventListener('click', togglePlayPause);
btnStop.addEventListener('click', stop);
btnBack.addEventListener('click', () => jumpTo(Math.max(0, currentIdx - 1)));
btnForward.addEventListener('click', () => jumpTo(currentIdx + 1));

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  // Don't capture when typing in inputs
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

  switch (e.code) {
    case 'Space':
      e.preventDefault();
      togglePlayPause();
      break;
    case 'KeyS':
      stop();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      jumpTo(Math.max(0, currentIdx - 1));
      break;
    case 'ArrowRight':
      e.preventDefault();
      jumpTo(currentIdx + 1);
      break;
    case 'Equal':
    case 'NumpadAdd':
      speedSlider.value = Math.min(3.0, parseFloat(speedSlider.value) + 0.1);
      speedDisplay.textContent = parseFloat(speedSlider.value).toFixed(1) + 'x';
      break;
    case 'Minus':
    case 'NumpadSubtract':
      speedSlider.value = Math.max(0.5, parseFloat(speedSlider.value) - 0.1);
      speedDisplay.textContent = parseFloat(speedSlider.value).toFixed(1) + 'x';
      break;
    case 'BracketLeft':
      fontSelect.selectedIndex = Math.max(0, fontSelect.selectedIndex - 1);
      reader.className = fontSelect.value;
      break;
    case 'BracketRight':
      fontSelect.selectedIndex = Math.min(fontSelect.options.length - 1, fontSelect.selectedIndex + 1);
      reader.className = fontSelect.value;
      break;
    case 'Home':
      e.preventDefault();
      jumpTo(0);
      break;
    case 'End':
      e.preventDefault();
      jumpTo(paragraphs.length - 1);
      break;
    case 'KeyG':
      const num = prompt('Jump to paragraph number:');
      if (num && !isNaN(num)) jumpTo(parseInt(num) - 1);
      break;
  }
});

// Watchdog: if synth stops unexpectedly mid-paragraph, resume from the sentence
// that was interrupted (not the start of the paragraph). A brief false reading of
// synth.speaking between queued utterances is normal, especially on iOS/Safari, so
// this only fires after a real stall (no activity for STALL_MS) rather than on the
// first poll that catches a gap.
const WATCHDOG_POLL_MS = 3000;
const STALL_MS = 4500;
setInterval(() => {
  if (
    engine === 'browser' &&
    isPlaying &&
    !isPaused &&
    !synth.speaking &&
    currentIdx >= 0 &&
    currentIdx < paragraphs.length &&
    Date.now() - lastSpeechActivity > STALL_MS
  ) {
    console.warn('Speech watchdog: synth stalled, resuming paragraph', currentIdx, 'at sentence', currentSentIdx);
    speak(currentIdx, currentSentIdx);
  }
}, WATCHDOG_POLL_MS);
</script>
</body>
</html>
